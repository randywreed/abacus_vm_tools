# Insert this fragment into the server block that Abacus selects for its
# public hostname. Abacus images may select either nginx.conf's
# `listen 80 default_server` block or default.conf's localhost block after
# host rewriting; the installer detects the selected layout before patching.
location = /hermes-classroom {
    return 404;
}

location ^~ /hermes-classroom/ {
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 330s;
    proxy_buffering off;
}
